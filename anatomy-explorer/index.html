<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Anatomy Explorer</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="1600" height="1000" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Anatomy Explorer</div>
      </div>
    </div>
    <script>
      let canvas = document.querySelector("#unity-canvas");
      let fullscreenContainer = document.querySelector("#unity-fullscreen-container");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/LiveServerWeb.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/LiveServerWeb.data",
        frameworkUrl: buildUrl + "/LiveServerWeb.framework.js",
        codeUrl: buildUrl + "/LiveServerWeb.wasm",
        streamingAssetsUrl: "StreamingAssets",

        // If you have a custom web site structure, or want to place multiple Unity build instances on the same page,
        // you can pass fullscreenElementID: "my-unity-fullscreen-container-id", in this configuration field to
        // explicitly point to the element tree root that is displayed in fullscreen mode.
        fullscreenElementID: "unity-fullscreen-container",

        companyName: "DefaultCompany",
        productName: "Anatomy Explorer",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas container in a window that can be maximized to fullscreen:
        fullscreenContainer.style.width = "1600px";
        fullscreenContainer.style.height = "1000px";
      }


      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * progress + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((unityInstance) => {
                // expose the instance so the monitor can talk to the scene
                window.unityInstance = unityInstance;
                if (window.OrbitCare && window.OrbitCare._onUnityReady) {
                  window.OrbitCare._onUnityReady(unityInstance);
                }
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  
  <!-- Blood & immune monitor overlay -->
  <style>
    #oc-overlay{position:fixed;inset:0;z-index:30;display:none;background:rgba(3,10,16,.72);
      backdrop-filter:blur(3px)}
    #oc-overlay.on{display:block}
    #oc-panel{position:absolute;inset:2.5vh 2.5vw;background:#06121b;border:1px solid #213a4b;
      display:flex;flex-direction:column;border-radius:14px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.6)}
    #oc-panel iframe{width:100%;flex:1;min-height:0;border:0;display:block;background:#06121b}
    #oc-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;color:#e8f2f8;font:500 14px system-ui,sans-serif}
    #oc-close{font:500 12px/1 system-ui,sans-serif;
      color:#b8cad7;background:#0c2331;border:1px solid #213a4b;border-radius:8px;
      padding:7px 12px;cursor:pointer}
  </style>
  <div id="oc-overlay" aria-hidden="true">
    <div id="oc-panel" role="dialog" aria-modal="true" aria-labelledby="oc-title">
      <div id="oc-header"><span id="oc-title">Health monitor</span><button id="oc-close" type="button">Close &#10005;</button></div>
      <iframe id="oc-frame" title="Blood and immune monitor"></iframe>
    </div>
  </div>
  <script>
    (function(){
      var overlay = document.getElementById('oc-overlay');
      var frame   = document.getElementById('oc-frame');

      // The shipped build still opens its own explanation window on topic
      // select. AnatomyExplorer sits on a GameObject called "Anatomy Explorer",
      // so the window can be dismissed without rebuilding.
      var hidingUnityPanel = false;
      function hideUnityPanel(){
        var u = window.unityInstance;
        if(!u || typeof u.SendMessage !== 'function') return;
        hidingUnityPanel = true;
        try { u.SendMessage('Anatomy Explorer', 'CloseExplanation'); } catch(e) {}
        finally { hidingUnityPanel = false; }
      }

      // Two monitors live behind the anatomy model:
      // Feature-relative paths work on Live Server, the Python server, and static hosts.
      var SOURCE = { brain: '../sleep/web/index.html', immune: '../immune/web/index.html',
                     cardio: '../cardio/web/index.html',
                     sans: '../eye/web/index.html' };
      var current = null;

      function open(which){
        var src = SOURCE[which] || SOURCE.immune;
        frame.title = ({brain:'Brain — Sleep and reaction', sans:'Eyes — SANS monitor', cardio:'Heart monitor', immune:'Immune system monitor'})[which] || 'Health monitor';
        document.getElementById('oc-title').textContent = frame.title;
        if(src !== current){ frame.src = src; current = src; }
        overlay.classList.add('on');
        overlay.setAttribute('aria-hidden','false');
        notifyUnity(true);
        // Defer one turn: Unity handles the message between frames, after it
        // has finished the selection that logged the line we reacted to.
        setTimeout(hideUnityPanel, 0);
      }
      function close(){
        if(hidingUnityPanel) return;
        if(!overlay.classList.contains('on')) return;
        if(frame.contentWindow && frame.src) frame.contentWindow.postMessage({type:'orbitcare',action:'closed'},new URL(frame.src,location.href).origin);
        overlay.classList.remove('on');
        overlay.setAttribute('aria-hidden','true');
        notifyUnity(false);
      }
      function toggle(){ overlay.classList.contains('on') ? close() : open(); }
      function isOpen(){ return overlay.classList.contains('on'); }

      // ── page -> Unity ────────────────────────────────────────────────
      // Works once the scene contains an "OrbitCareBridge" object with an
      // OnMonitorOpen(string) method. Silent no-op until then.
      function notifyUnity(open){
        var u = window.unityInstance;
        if(!u || typeof u.SendMessage !== 'function') return;
        try { u.SendMessage('OrbitCareBridge', 'OnMonitorOpen', open ? '1' : '0'); }
        catch(e) {}
      }

      // ── Unity -> page, without rebuilding the build ─────────────────
      // AnatomyExplorer logs every topic selection with Debug.Log, and the
      // loader routes Module.print to console.log. Watching that stream is
      // enough to know which topic is open, so the scene needs no change.
      var TOPIC_IMMUNE = /Selected\s+Immune system/i;
      var TOPIC_EYES   = /Selected\s+Eyes\b/i;
      var TOPIC_HEART  = /Selected\s+Heart\b/i;
      var TOPIC_BRAIN  = /Selected\s+Brain\b/i;
      var TOPIC_OTHER  = /Selected\s+Bones\b/i;
      var VIEW_RESET   = /View reset/i;

      (function hookConsole(){
        var native = console.log;
        console.log = function(){
          try {
            var msg = Array.prototype.map.call(arguments, function(a){
              return (typeof a === 'string') ? a : '';
            }).join(' ');
            if(TOPIC_IMMUNE.test(msg)) open('immune');
            else if(TOPIC_EYES.test(msg)) open('sans');
            else if(TOPIC_HEART.test(msg)) open('cardio');
            else if(TOPIC_BRAIN.test(msg)) open('brain');
            else if(TOPIC_OTHER.test(msg) || VIEW_RESET.test(msg)) close();
          } catch(e) {}
          return native.apply(console, arguments);
        };
      })();

      // ── programmatic entry points (kept for the rebuilt build) ───────
      window.OrbitCare = { open: function(w){ open(w || 'immune'); }, close: close,
                     toggle: toggle, isOpen: isOpen,
                           _onUnityReady: function(){ if(isOpen()) notifyUnity(true); } };
      window.addEventListener('orbitcare:open', function(e){ open(e && e.detail); });
      window.addEventListener('orbitcare:close', close);
      window.addEventListener('orbitcare:toggle', toggle);

      // ── postMessage ─────────────────────────────────────────────────
      window.addEventListener('message', function(e){
        if(e.source !== frame.contentWindow || !frame.src || e.origin !== new URL(frame.src,location.href).origin) return;
        var d = e && e.data;
        if(d === 'close-immune') return close();
        if(d && d.type === 'orbitcare'){
          if(d.action === 'open') open();
          else if(d.action === 'close') close();
          else if(d.action === 'toggle') toggle();
        }
      });

      // ── deep link ───────────────────────────────────────────────────
      try {
        var qs = new URLSearchParams(location.search);
        var want = qs.get('monitor');
        if(want === 'brain' || want === 'sans' || want === 'immune' || want === 'cardio') open(want);
        else if(qs.get('immune') === '1' || location.hash === '#immune') open('immune');
      } catch(e) {}

      // ── local controls ──────────────────────────────────────────────
      document.getElementById('oc-close').addEventListener('click', close);
      overlay.addEventListener('click', function(e){ if(e.target === overlay) close(); });
      document.addEventListener('keydown', function(e){ if(e.key === 'Escape') close(); });
    })();
  </script>
</body>
</html>
